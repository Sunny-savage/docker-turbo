---
    ## build docker image
    ## push it to the docker hub
    ## ssh into vm and deploy the latest machine
    
    name: Deploy frontend CICD
    on:
      push:
        branches: [main]
    
    jobs:
      build:
        runs-on: ubuntu-latest
    
        steps:
          - name: checkout the code
            uses: actions/checkout@v2
    
          - name: Docker login
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}




          - name: Build and push
            uses: docker/build-push-action@v4
            with:
              context: .
              file: ./docker/Dockerfile.frontend
              build-args: DATABASE_URL=${{ secrets.DATABASE_URL }}
              push: true
              tags: visunie/todo-app-frontend:${{ github.sha }}

          - name : Deploy to VM
            run: |
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
                 
                  chmod 700 /home/runner/ssh_key
                  ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@13.61.184.195 -t "docker ps -aq | xargs -r docker stop && docker ps -aq | xargs -r docker rm && docker run --name user_backend -e DATABASE_URL=${{ secrets.DATABASE_URL }} -d -p 3000:3000 visunie/todo-app-frontend:${{ github.sha }}"