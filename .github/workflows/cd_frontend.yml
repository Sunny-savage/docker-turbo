---
    ## build docker image
    ## push it to the docker hub
    ## ssh into vm and deploy the latest machine
    
    name: Deploy frontend CICD
    on:
      push:
        branches: [main]
    
    jobs:
      build:
        runs-on: ubuntu-latest
    
        steps:
          - name: checkout the code
            uses: actions/checkout@v2
    
          - name: Docker login
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
    
          - name: Build and push
            uses: docker/build-push-action@v4
            with:
              context: .
              file: ./docker/Dockerfile.frontend
              build-args: |
                 DATABASE_URL=${{ secrets.DATABASE_URL }}
              push: true
              tags: visunie/todo-app-frontend:${{ github.sha }}

          - name : Deploy to VM
            run: |
              echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
              mkdir -p /home/runner/.ssh
              
              chmod 700 /home/runner/ssh_key
              ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@64.227.147.124 -t "docker stop user_backend && docker run --name user_backend -d -p 8080:8080 100xdevs/user-app-backend:${{ github.sha }}"